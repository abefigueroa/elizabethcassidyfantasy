<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Elizabeth Cassidy Fantasy{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <nav>
        <a href="{{ url_for('home') }}" class="site_logo">
            <img src="{{ url_for('static', filename='images/Elizabeth_Cassidy.png') }}"
                alt="Elizabeth Cassidy logo">
        </a>

        {% if session.get("user_id") and request.path.startswith("/draft-quest") %}

            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('draft_quest') }}">Draft Quest</a>
            <a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>

            <form method="POST"
                action="{{ url_for('logout') }}"
                class="nav_logout_form">
                <button type="submit" class="nav_logout_button">
                    Log Out
                </button>
            </form>

        {% else %}

            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('books') }}">Books</a>
            <a href="{{ url_for('connect') }}">Connect</a>
            <a href="{{ url_for('draft_quest') }}">Draft Quest</a>

        {% endif %}
    </nav>

    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}

</body>
</html>
