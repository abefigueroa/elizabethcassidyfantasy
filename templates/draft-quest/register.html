{% extends "base.html" %}

{% block title %}
Register | Draft Quest
{% endblock %}

{% block extra_css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/draft-quest.css') }}">
{% endblock %}

{% block content %}

<main class="draft_quest_home">

    <h1>Join Draft Quest</h1>

    <div class="title_divider"></div>

    {% if error %}
        <p class="form_error">{{ error }}</p>
    {% endif %}

    <form method="POST" class="registration_form">

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="display_name">Display Name</label>
        <input
            type="text"
            id="display_name"
            name="display_name"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

</main>

{% endblock %}
