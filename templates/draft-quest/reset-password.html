{% extends "base.html" %}

{% block title %}Reset Password | Draft Quest{% endblock %}

{% block extra_css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/draft-quest.css') }}">
{% endblock %}

{% block content %}
<main class="quest_dashboard registration_page">
    <section class="dashboard_panel registration_card"
             aria-labelledby="reset_password_heading">
        <header class="dashboard_header">
            <p class="dashboard_eyebrow">Draft Quest</p>
            <h1 id="reset_password_heading">Choose a new password</h1>
        </header>

        {% if error %}
            <p class="dashboard_error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="POST" class="dashboard_form">
            <label for="password">New password</label>
            <input type="password"
                   id="password"
                   name="password"
                   autocomplete="new-password"
                   required>

            <label for="confirm_password">Confirm new password</label>
            <input type="password"
                   id="confirm_password"
                   name="confirm_password"
                   autocomplete="new-password"
                   required>

            <button type="submit">Reset password</button>
        </form>
    </section>
</main>
{% endblock %}
