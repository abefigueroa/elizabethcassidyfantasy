{% extends "base.html" %}

{% block title %}
Login | Draft Quest
{% endblock %}

{% block extra_css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/draft-quest.css') }}">
{% endblock %}

{% block content %}

<main class="draft_quest_home">

    <h1>Login to Draft Quest</h1>

    <div class="title_divider"></div>

    {% if error %}
        <p class="form_error">{{ error }}</p>
    {% endif %}

    <form method="POST" class="auth_form">

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="{{ url_for('register') }}">Register</a>
    </p>

</main>

{% endblock %}
