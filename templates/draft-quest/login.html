{% extends "base.html" %}

{% block title %}
Login | Draft Quest
{% endblock %}

{% block extra_css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/draft-quest.css') }}">
{% endblock %}

{% block content %}

<main class="quest_dashboard registration_page">
    <section class="dashboard_panel registration_card" aria-labelledby="login_heading">
        <header class="dashboard_header">
            <p class="dashboard_eyebrow">Draft Quest</p>
            <h1 id="login_heading">Welcome back</h1>
            <p>Log in to continue your writing quest.</p>
        </header>

        {% if error %}
            <p class="dashboard_error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="POST" class="dashboard_form">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                value="{{ request.form.get('email', '') }}"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Log in
            </button>

        </form>

        <p class="registration_login">
            <a href="{{ url_for('register') }}">Create an account</a>
            <span aria-hidden="true"> &middot; </span>
            <a href="{{ url_for('password_reset.forgot_password') }}">
                Forgot password?
            </a>
        </p>
    </section>
</main>

{% endblock %}
